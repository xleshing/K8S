apiVersion: apps/v1
kind: Deployment
metadata:
  name: lf-trainer
  namespace: load-forecast
spec:
  replicas: 1
  selector:
    matchLabels: { app: lf-trainer }
  template:
    metadata:
      labels: { app: lf-trainer }
    spec:
      containers:
        - name: trainer
          image: YOUR_REG/lf-trainer:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: lf-config }
            - secretRef: { name: lf-mysql }
          env:
            - name: DB_HOST
              valueFrom: { configMapKeyRef: { name: lf-config, key: DB_HOST } }
            - name: DB_NAME
              valueFrom: { configMapKeyRef: { name: lf-config, key: DB_NAME } }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: lf-mysql, key: DB_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: lf-mysql, key: DB_PASSWORD } }
            - name: MODEL_DIR
              value: "/models"
          volumeMounts:
            - name: models
              mountPath: /models
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits: { cpu: "1", memory: "1Gi" }
          livenessProbe:
            exec: { command: ["sh", "-c", "ps aux | grep -v grep | grep trainer_online.py"] }
            initialDelaySeconds: 20
            periodSeconds: 30
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: lf-models-pvc